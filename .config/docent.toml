#:schema ../zig-out/schema/docent.schema.json

[check]
include = ["lib/"]
inherit_manifest = false

[fmt]
include = ["lib/", "internal/", "cmd/"]
sort_imports = true
single_line_braces = false
logical_blank_lines = false
trailing_comma = true
sort_doctests = true

[doc]
scan_mode = "public"
invalid_leading_phrase = "allow"
missing_summary_terminal_punctuation = "allow"

[doc.missing_doc_comment]
level = "warn"
check_errors = false
check_parameters = false
check_fields = false
check_enumerators = false
